name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC. Kurse: alle 2 Stunden an Börsentagen (07–21 UTC deckt Xetra und NYSE ab)
    - cron: '17 7-21/2 * * 1-5'
    # Alles (Kennzahlen, Empfehlungen, Kursziel): 1x täglich vor Börsenstart
    - cron: '43 4 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Umfang'
        type: choice
        options: [full, quotes]
        default: full
  push:
    branches: [main]
    paths: [watchlist.txt]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Modus bestimmen
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="$INPUT_MODE"
          elif [ "$SCHEDULE" = "17 7-21/2 * * 1-5" ]; then MODE=quotes
          else MODE=full; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: node --test scripts/score.test.mjs

      - name: Daten holen
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/update.mjs "${{ steps.mode.outputs.mode }}"

      - name: data.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Daten aktualisiert (${{ steps.mode.outputs.mode }})"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
